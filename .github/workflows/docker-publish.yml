name: Publish image & MCP Registry entry

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish, without the leading v (e.g. 1.0.2). Defaults to the version in server.json.'
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # A release is a version in server.json that the MCP Registry has not seen.
  # Deciding that up front keeps an already-released image tag from being
  # overwritten by a later push that did not bump the version.
  release-check:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and whether it is unreleased
        id: resolve
        run: |
          set -euo pipefail
          NAME=$(jq -r .name server.json)
          FILE_VERSION=$(jq -r .version server.json)

          VERSION="${{ inputs.version }}"
          VERSION="${VERSION:-$FILE_VERSION}"
          VERSION="${VERSION#v}"

          # A tag has to name the version the repository actually declares.
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$FILE_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match server.json version $FILE_VERSION"
            exit 1
          fi

          FOUND=$(curl -fsS --get "https://registry.modelcontextprotocol.io/v0/servers" \
            --data-urlencode "search=$NAME" \
            --data-urlencode "version=$VERSION" \
            | jq --arg n "$NAME" '[.servers[]? | select(.name == $n)] | length')

          if [ "${FOUND:-0}" = "0" ]; then RELEASE=true; else RELEASE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "$NAME $VERSION — unreleased: $RELEASE" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: build & push to GHCR
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ohneben/learnworlds-mcp
          # The bare version tag is only minted for a version the registry has
          # not seen, so a released tag is never repointed at a later build.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release-check.outputs.version }},enable=${{ needs.release-check.outputs.release == 'true' }}
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-registry:
    name: publish to MCP Registry
    # Needs the image it points at to exist in GHCR first.
    needs: [release-check, publish]
    if: needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — proves the io.github.ohneben namespace
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Pin server.json to the released version
        env:
          VERSION: ${{ needs.release-check.outputs.version }}
        run: |
          # An OCI package carries the registry host and the version in its
          # canonical identifier; the registry rejects registryBaseUrl, version
          # and fileSha256 alongside it, so strip them here as well.
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier = "ghcr.io/ohneben/learnworlds-mcp:" + $v
            | .packages[0] |= del(.registryBaseUrl, .version, .fileSha256)
          ' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      # release-check already skips an published version, but a tag push and the
      # main-branch run are separate refs and so separate concurrency groups:
      # both can resolve "unreleased" before either finishes. Losing that race
      # is a no-op, not a failure.
      - name: Publish server to the MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            case "$OUTPUT" in
              *'cannot publish duplicate version'*)
                echo "::notice::Version is already in the registry; nothing to do."
                exit 0
                ;;
            esac
            exit "$STATUS"
          fi
