name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish, without the leading v (e.g. 1.0.2). Also published to the MCP Registry.'
        required: true
        type: string

concurrency:
  group: docker-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ohneben/learnworlds-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-registry:
    name: publish to MCP Registry
    # Only a version tag or an explicit dispatch produces an image the registry
    # can verify, and this must not start before that image exists in GHCR.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — proves the io.github.ohneben namespace
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Pin server.json to the released version
        id: pin
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="$GITHUB_REF_NAME"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = "ghcr.io/ohneben/learnworlds-mcp:" + $v
          ' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher validate
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A tag push and a published release both land here for the same ref, so
      # skip rather than fail if the registry already carries this version.
      - name: Check whether the version is already published
        id: published
        run: |
          NAME=$(jq -r .name server.json)
          FOUND=$(curl -fsS --get "https://registry.modelcontextprotocol.io/v0/servers" \
            --data-urlencode "search=$NAME" \
            --data-urlencode "version=${{ steps.pin.outputs.version }}" \
            | jq --arg n "$NAME" '[.servers[]? | select(.name == $n)] | length')
          echo "found=${FOUND:-0}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to the MCP Registry
        if: steps.published.outputs.found == '0'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        if: steps.published.outputs.found == '0'
        run: ./mcp-publisher publish
